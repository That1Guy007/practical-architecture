<nav class="tl-breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ site.Home.RelPermalink }}">Main site</a></li>
    {{ range .Ancestors.Reverse }}
      {{ if not .IsHome }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle | default .Title }}</a></li>
      {{ end }}
    {{ end }}
    <li aria-current="page">{{ .LinkTitle | default .Title }}</li>
  </ol>
</nav>
